app:
  owner_id: "change me"
  bot_id: "change me"
  role_id: "change me"
  enable_commands: false

auth:
  discord_token: "change me"
  openai_key: "change me"

database:
  dsn: "postgres://user:pass@localhost:5432/ama3?sslmode=disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "15m"

platform:
  whitelist_guilds: []
  replacements:
    enabled: false
    twitter: "fxtwitter.com"
    instagram: "d.vxinstagram.com"

ai:
  personality: "example" ## same as filename in personalities folder   
  
  interest:
    interest_score_threshold: 0.7
    past_message_limit: 12
    cooldown_seconds: 600
    enable_interest_detection: false

  runtime:
    enable_direct_throttle: true
    conversation_ttl_seconds: 21600
    max_conversation_mappings: 1000
    direct_flow_user_cooldown_seconds: 3
    direct_flow_channel_cooldown_seconds: 1
    max_direct_limiter_entries: 4000
    model_max_concurrent: 2
    model_min_interval_ms: 250
    model_quota_cooldown_seconds: 60
    noise_reaction_probability: 0.70
    noise_response_model: "gpt-5.4-mini"

  summary:
    enabled: false
    max_characters: 600
    message_threshold: 30
    summary_message_limit: 30

  history_summary:
    enabled: false
    message_threshold_characters: 500
    max_summary_characters: 300

  memory:
    enabled: true
    write_enabled: true
    enable_embeddings: true
    dedup_similarity: 0.92
    local_gate_enabled: true
    retrieval_mode: always
    extraction_model: "gpt-5-mini"
    self_extraction_model: "gpt-5-mini"
    embedding_model: "text-embedding-3-small"
    embedding_dimensions: 1536
    embedding_cache_max_entries: 2048
    embedding_cache_ttl_seconds: 3600
    self_max_injected_characters: 3500
    max_injected_characters: 2000

security:
  # AES-256 encryption key for at-rest encryption of user summary data.
  # Must be exactly 64 hex characters (32 bytes). Generate with: openssl rand -hex 32
  # Leave empty to disable encryption (summaries stored as plaintext).
  encryption_key: ""
